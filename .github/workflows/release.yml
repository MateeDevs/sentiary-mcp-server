name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "version=v$(date -u +%Y.%m.%d)-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          binary="sentiary-mcp-server-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o "dist/${binary}" .

      - name: Package
        id: package
        shell: bash
        run: |
          cd dist
          asset="sentiary-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar -czf "${asset}.tar.gz" "${asset}"
          echo "asset=dist/${asset}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Sentiary MCP ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Install

            Install the latest release binary as `sentiary-mcp-server`:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/MateeDevs/sentiary-mcp-server/main/install.sh | sh
            ```

            Or install from source with Go:

            ```sh
            go install github.com/MateeDevs/sentiary-mcp-server@latest
            ```

            `go install` creates a `sentiary-mcp-server` binary. Use that command name in your MCP client config when installing with Go.
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.package.outputs.asset }}
